<!DOCTYPE html>
<html>
<head>
<title>Payment Due</title>
<style>
body{font-family:Arial; background:#e6f7ff; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px;}
.box{background:#fff; padding:30px; border-radius:10px; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,0.1); max-width:420px; width:100%; border-top:5px solid #d32f2f;}
h1{color:#d32f2f;}.amount{font-size:2.2em; color:#d32f2f; font-weight:bold;}
.btn{background:#25D366; color:white; padding:14px 25px; border-radius:8px; text-decoration:none; font-weight:bold; display:inline-block; margin-top:15px;}
</style>
</head>
<body>
<div class="box" id="box">
<h1>⚠️ INTERNET PAUSED</h1>
<p>Loading...</p>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const user = urlParams.get('user') || 'unknown';
const csv_url = "https://docs.google.com/spreadsheets/d/1fqJXZJ6FAZPqcReFvGugADeQXh-KUsPen90na8eTu7I/gviz/tq?tqx=out:csv";

fetch(csv_url)
.then(res => res.text())
.then(csv => {
    const rows = csv.split('\n').map(row => row.split(','));
    let name = user, amount = "500", plan = "Unknown";

    for(let i=1; i<rows.length; i++){
        if(rows[i][0] && rows[i][0].replace(/"/g,'').toLowerCase() == user.toLowerCase()){
            name = rows[i][1].replace(/"/g,'');
            amount = rows[i][2].replace(/"/g,'');
            plan = rows[i][3].replace(/"/g,'');
            break;
        }
    }

    document.getElementById('box').innerHTML = `
    <h1>⚠️ INTERNET PAUSED</h1>
    <p>Hi <b>${name}</b></p>
    <div style="background:#f5f5f5; padding:15px; border-radius:8px; margin:15px 0;">
    Account: <b>${user}</b><br>
    Plan: <b>${plan}</b>
    </div>
    <p>Amount Due:</p>
    <p class="amount">Php ${amount}</p>
    <h3>Pay via GCash</h3>
    <span><b>Account Name:</b> Dave Malinao</span><br>
    <span><b>Number:</b> 0955-439-9280</span><br>
    <a href="https://m.me/dave.malinao?text=Payment%20Proof%20for%20${user}%20Amount:%20${amount}" class="btn" target="_blank">SEND PROOF OF PAYMENT</a>
    `;
});
</script>
</body>
</html>
